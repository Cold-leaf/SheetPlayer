name: Validate shared annotations
on:
  push:
    paths: ['annotations/**', 'scripts/annotations.py', 'tests/test_annotations.py', '.github/workflows/annotations.yml']
  pull_request:
    paths: ['annotations/**', 'scripts/annotations.py', 'tests/test_annotations.py', '.github/workflows/annotations.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/annotations.py
      - run: python3 -m unittest discover -s tests -p test_annotations.py
